baseurl: https://kanpapa.com/
locale: ja 
theme: hugo-theme-stack
title: きょうのかんぱぱ
copyright: kanpapa.com
images:
  - images/ogp.jpg

# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: ja

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: true

languages:
    ja:
        label: Japanese
        title: きょうのかんぱぱ
        weight: 1
        params:
            dateFormat:
                published: 2006年1月2日
                lastUpdated: 2006年1月2日15時04分
            sidebar:
                subtitle: ロボット、マイコン、電子工作などデジモノが大好きなかんぱぱの日記です。
#    en:
#        languageName: English
#        title: kanpapa.com
#        weight: 1
#        params:
#            sidebar:
#                subtitle: Example description
#    zh-cn:
#        languageName: 中文
#        title: 演示站点
#        weight: 2
#        params:
#            sidebar:
#                subtitle: 演示说明
#    ar:
#        languageName: عربي
#        languagedirection: rtl
#        title: موقع تجريبي
#        weight: 3
#        params:
#            sidebar:
#                subtitle: وصف تجريبي

services:
    # Change it to your Disqus shortname before using
    disqus:
        shortname: "hugo-theme-stack"
    # GA Tracking ID
    googleAnalytics:
        id: G-2PLD7SF0FC
    rss:
        limit: 20

pagination:
    pagerSize: 6

uglyURLs: true

permalinks:
    # post（記事）の設定： 年/月/スラッグ.html
    post: /:year/:month/:slug
    # page（固定ページ）の設定： そのまま維持
    page: /:slug/

    #permalinks:
    #post: /p/:slug/
    #page: /:slug/

params:
    mainSections:
        - post
    featuredImageField: image
    rssFullContent: true
    favicon: /favicon.ico
    footer:
        since: 2005
        customText:

    dateFormat:
        published: Jan 02, 2006
        lastUpdated: Jan 02, 2006 15:04 JST

    sidebar:
    #    emoji: 🍥
        subtitle: Lorem ipsum dolor sit amet, consectetur adipiscing elit.
        avatar: "img/avatar.png"

    article:
        math: false
        toc: true
        readingTime: true
        license:
            enabled: true
            default: Licensed under CC BY-SA 4.0

    comments:
        enabled: false
        provider: disqus

        disqusjs:
            shortname:
            apiUrl:
            apiKey:
            admin:
            adminLabel:

        utterances:
            repo:
            issueTerm: pathname
            label:

        beaudar:
            repo:
            issueTerm: pathname
            label:
            theme:

        remark42:
            host:
            site:
            locale:

        vssue:
            platform:
            owner:
            repo:
            clientId:
            clientSecret:
            autoCreateIssue: false

        # Waline client configuration see: https://waline.js.org/en/reference/component.html
        waline:
            serverURL:
            lang:
            pageview:
            emoji:
                - https://unpkg.com/@waline/emojis@1.0.1/weibo
            requiredMeta:
                - name
                - email
                - url
            locale:
                admin: Admin
                placeholder:

        twikoo:
            envId:
            region:
            path:
            lang:

        # See https://cactus.chat/docs/reference/web-client/#configuration for description of the various options
        cactus:
            defaultHomeserverUrl: "https://matrix.cactus.chat:8448"
            serverName: "cactus.chat"
            siteName: "" # You must insert a unique identifier here matching the one you registered (See https://cactus.chat/docs/getting-started/quick-start/#register-your-site)

        giscus:
            repo:
            repoID:
            category:
            categoryID:
            mapping:
            lightTheme:
            darkTheme:
            reactionsEnabled: 1
            emitMetadata: 0

        gitalk:
            owner:
            admin:
            repo:
            clientID:
            clientSecret:
            proxy:

        cusdis:
            host:
            id:
    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 20
            - type: tag-cloud
              params:
                  limit: 40
        page:
            - type: toc

    opengraph:
        twitter:
            # Your Twitter username
            site: kanpapa

            # Available values: summary, summary_large_image
            #card: summary_large_image
            card: summary

    defaultImage:
        opengraph:
            enabled: true
            local: true
            src: img/neko_630x630.png

    colorScheme:
        # Display toggle
        toggle: true

        # Available values: auto, light, dark
        default: dark

    imageProcessing:
        cover:
            enabled: false
        content:
            enabled: false

### Custom menu
### See https://stack.jimmycai.com/config/menu
### To remove about, archive and search page menu item, remove `menu` field from their FrontMatter
menu:
    main: []

    social:
        - identifier: github
          name: GitHub
          url: https://github.com/kanpapa
          params:
              icon: brand-github

        - identifier: twitter
          name: X
          url: https://x.com/kanpapa
          params:
              icon: brand-twitter

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    goldmark:
        extensions:
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: false
        lineNumbersInTable: true
        tabWidth: 4

imaging:
  resampleFilter: lanczos
  quality: 60                # 75から60に下げる（見た目はほぼ変わりませんが軽量化に効きます）
  hint: photo                # エラー修正：webpではなくphotoを指定

build:
  renderUnusedResources: false
  useResourceCacheWhenPossible: true

